name: singlink_vpn
description: "SingLinkVPN first-generation client for Windows, macOS, Android and iOS (Flutter UI over the SingLink Beta Protocol core via FFI)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2

# Deliberately plugin-free: no CocoaPods / Swift Package Manager needed to build
# the macOS target. Persistence uses dart:io, clipboard uses flutter/services.
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
