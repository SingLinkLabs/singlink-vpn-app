# Builds SingLinkVPN for every platform and runs the tests.
#
# Layout on every runner (the core's go.mod has
# `replace github.com/SingLinkLabs/singlink-protocol => ../../singlink-protocol`,
# relative to singlink-vpn-app/core):
#
#   $GITHUB_WORKSPACE/singlink-vpn-app/    this repository
#   $GITHUB_WORKSPACE/singlink-protocol/   SingLinkLabs/singlink-protocol
#
# Public protocol source is checked out at the immutable reviewed revision.
# Runner images are selected by name (no -latest labels; GitHub still updates
# an image's contents within a name), checkouts do not persist the job token,
# and toolchains are pinned (Go from core/go.mod, govulncheck, Flutter and
# pubspec.lock, MinGW, the Android NDK, the Gradle distribution checksum).
name: build

on:
  push:
    branches: [main, 'platform/**']
  pull_request:
  workflow_dispatch:

# Least privilege: nothing by default; each job grants only what it needs.
# Every third-party action is pinned to a full commit SHA (tag in the comment).
permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.6'
  APP: singlink-vpn-app

defaults:
  run:
    shell: bash

jobs:
  test:
    name: tests (go + flutter)
    permissions:
      contents: read
    runs-on: macos-26  # pinned image; change deliberately
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: singlink-vpn-app
      - name: Read approved protocol revision
        id: protocol-pin
        # Fails the step (bash -e) if the pin record and go.mod disagree.
        run: |
          rev="$(python3 singlink-vpn-app/scripts/protocol_provenance.py pin)"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ steps.protocol-pin.outputs.revision }}
          repository: SingLinkLabs/singlink-protocol
          path: singlink-protocol
          token: ${{ github.token }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: singlink-vpn-app/core/go.mod
          cache-dependency-path: singlink-vpn-app/core/go.sum
      - name: go vet + go test (core)
        working-directory: singlink-vpn-app/core
        env:
          # The C ABI harness (core/ffi/cabi_test.go) must run, not skip.
          SINGLINK_REQUIRE_CABI_TEST: '1'
        run: |
          python3 ../scripts/protocol_provenance.py verify
          want="go$(sed -n 's/^go //p' go.mod)"
          go version
          case "$(go version)" in
            *" $want "*) ;;
            *) echo "Go toolchain is not $want from core/go.mod"; exit 1 ;;
          esac
          go vet ./...
          go test -race ./...
      - name: govulncheck (pinned; fails on reachable vulnerabilities)
        working-directory: singlink-vpn-app/core
        # `go install` of an exact version is checked against the Go
        # checksum database. govulncheck exits non-zero when a known
        # vulnerability is reachable from this module or the pinned protocol.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$(go env GOPATH)/bin/govulncheck" -version
          "$(go env GOPATH)/bin/govulncheck" ./...
          # The iOS core is built from the same packages for GOOS=ios.
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Build core for synthetic parser integration
        run: make -C singlink-vpn-app/core macos
      - name: go vet (core, GOOS=windows)
        working-directory: singlink-vpn-app/core
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./tunnel/...
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: singlink-vpn-app
        run: flutter pub get --enforce-lockfile
      - name: Source and signing safety gates
        working-directory: singlink-vpn-app
        run: python3 scripts/test_security_build_gates.py
      - name: flutter analyze
        working-directory: singlink-vpn-app
        run: flutter analyze
      - name: flutter test (all but goldens)
        working-directory: singlink-vpn-app
        env:
          SINGLINK_REQUIRE_FFI_MOCK: '1'  # the FFI payload test must not skip
        run: flutter test $(ls test/*_test.dart | grep -v golden_test.dart)
      # Goldens are rendered with the developer's macOS fonts; a different
      # macOS image can shift glyphs by a pixel, so they only warn here.
      - name: flutter test (goldens, informational)
        id: goldens
        continue-on-error: true
        working-directory: singlink-vpn-app
        run: flutter test test/golden_test.dart
      - if: steps.goldens.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-failures
          path: singlink-vpn-app/test/failures/
          if-no-files-found: ignore

  windows:
    name: windows (x64)
    permissions:
      contents: read
      id-token: write      # build provenance attestation
      attestations: write  # build provenance attestation
    runs-on: windows-2022  # windows-latest ships VS 2026, which Flutter 3.35 cannot detect
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: singlink-vpn-app
      - name: Read approved protocol revision
        id: protocol-pin
        # Fails the step (bash -e) if the pin record and go.mod disagree.
        run: |
          rev="$(python singlink-vpn-app/scripts/protocol_provenance.py pin)"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ steps.protocol-pin.outputs.revision }}
          repository: SingLinkLabs/singlink-protocol
          path: singlink-protocol
          token: ${{ github.token }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: singlink-vpn-app/core/go.mod
          cache-dependency-path: singlink-vpn-app/core/go.sum
      - name: MinGW-w64 gcc (cgo), pinned
        shell: pwsh
        env:
          MINGW_VERSION: '14.2.0'
        # Always the pinned Chocolatey package (its install script verifies
        # the SHA-256 of the download), never whatever gcc the image has.
        run: |
          choco install mingw --version $env:MINGW_VERSION --no-progress -y --force
          $bin = "C:\ProgramData\mingw64\mingw64\bin"
          $v = (& "$bin\gcc.exe" -dumpfullversion).Trim()
          if ($v -ne $env:MINGW_VERSION) { throw "gcc $v installed, $env:MINGW_VERSION pinned" }
          "gcc $v sha256 $((Get-FileHash -Algorithm SHA256 "$bin\gcc.exe").Hash)"
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: govulncheck (windows/amd64 build of the core)
        working-directory: singlink-vpn-app/core
        env:
          CGO_ENABLED: '1'
          CC: gcc
        # `go run` of an exact version is checked against the Go checksum
        # database, like `go install` in the other jobs.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Build singlink.dll
        working-directory: singlink-vpn-app/core
        # Same command as `make -C core windows` (core/Makefile), with MinGW
        # gcc as the C compiler.
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: amd64
          CC: gcc
        run: |
          gcc --version | sed -n 1p  # sed reads everything: no SIGPIPE under pipefail
          case "$(command -v gcc)" in
            */ProgramData/mingw64/mingw64/bin/gcc*) ;;
            *) echo "gcc is not the pinned MinGW: $(command -v gcc)"; exit 1 ;;
          esac
          mkdir -p build/windows
          go build -trimpath -buildmode=c-shared -ldflags='-s -w' -o build/windows/singlink.dll ./ffi
          python ../scripts/protocol_provenance.py record build/windows/singlink.dll
          ls -l build/windows
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: singlink-vpn-app
        run: flutter pub get --enforce-lockfile
      - name: Windows system proxy tests (fake + real registry)
        working-directory: singlink-vpn-app
        env:
          SINGLINK_WINDOWS_REGISTRY_TEST: '1'
        run: flutter test test/windows_system_proxy_test.dart test/windows_registry_smoke_test.dart
      - name: flutter test (full suite)
        working-directory: singlink-vpn-app
        env:
          # The synthetic parser test runs against the DLL built above.
          SINGLINK_SYNTHETIC_ABI_LIB: core/build/windows/singlink.dll
        run: flutter test
      - name: flutter build windows
        working-directory: singlink-vpn-app
        env:
          SINGLINK_REQUIRE_CORE: '1'
        run: flutter build windows --release
      - name: Check bundle
        working-directory: singlink-vpn-app/build/windows/x64/runner/Release
        run: |
          ls -l
          test -f SingLinkVPN.exe
          test -f singlink.dll
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path singlink-vpn-app\build\windows\x64\runner\Release\* -DestinationPath SingLinkVPN-windows-x64-UNSIGNED-ci.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Not Authenticode-signed: a CI build for testing, not a release.
          name: SingLinkVPN-windows-x64-UNSIGNED-ci
          path: SingLinkVPN-windows-x64-UNSIGNED-ci.zip
          if-no-files-found: error
      - name: Attest build provenance
        # Signed SLSA provenance (Sigstore) for the uploaded artifact; verify
        # with `gh attestation verify <file> --repo SingLinkLabs/singlink-vpn-app`.
        # Pull requests from forks get no id-token, so only pushes attest.
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: SingLinkVPN-windows-x64-UNSIGNED-ci.zip

  android:
    name: android (apk)
    permissions:
      contents: read
      id-token: write      # build provenance attestation
      attestations: write  # build provenance attestation
    runs-on: ubuntu-26.04  # pinned image; change deliberately
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: singlink-vpn-app
      - name: Read approved protocol revision
        id: protocol-pin
        # Fails the step (bash -e) if the pin record and go.mod disagree.
        run: |
          rev="$(python3 singlink-vpn-app/scripts/protocol_provenance.py pin)"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ steps.protocol-pin.outputs.revision }}
          repository: SingLinkLabs/singlink-protocol
          path: singlink-protocol
          token: ${{ github.token }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: singlink-vpn-app/core/go.mod
          cache-dependency-path: singlink-vpn-app/core/go.sum
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: C ABI harness on Linux (descriptor ownership, proxy auth)
        working-directory: singlink-vpn-app/core
        env:
          SINGLINK_REQUIRE_CABI_TEST: '1'
        run: |
          python3 ../scripts/protocol_provenance.py verify
          go test -count=1 -run 'CABI|StartLocal|TunStart' ./ffi
      - name: Android NDK (pinned, same as core/Makefile)
        env:
          NDK_VERSION: '28.2.13676358'
        # sdkmanager verifies the package checksum from Google's repository.
        # `yes` is killed by SIGPIPE when sdkmanager exits, which fails the
        # step under pipefail, so its status is ignored; the source.properties
        # check below is the gate.
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ ! -d "$sdk/ndk/$NDK_VERSION" ]; then
            { yes 2>/dev/null || true; } | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          fi
          grep -q "Pkg.Revision = ${NDK_VERSION%.*}" "$sdk/ndk/$NDK_VERSION/source.properties"
          echo "PINNED_NDK=$sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: govulncheck (android/arm64 build of the core)
        working-directory: singlink-vpn-app/core
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
            CC="$PINNED_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
            "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Build libsinglink.so (NDK)
        # The Makefile's NDK_BIN defaults to the macOS host toolchain, so
        # point it at the pinned NDK's Linux toolchain.
        run: |
          NDK="$PINNED_NDK"
          echo "NDK: $NDK"
          make -C singlink-vpn-app/core android \
            ANDROID_NDK_HOME="$NDK" \
            NDK_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          find singlink-vpn-app/core/build/android -name '*.so' -exec ls -l {} +
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: flutter build apk
        working-directory: singlink-vpn-app
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --debug
      - name: Kotlin unit tests (VpnBridge descriptor ownership, always-on start)
        working-directory: singlink-vpn-app/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SingLinkVPN-android-DEMO-debug-apk
          path: singlink-vpn-app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
      - name: Attest build provenance
        # Signed SLSA provenance (Sigstore) for the uploaded artifact; verify
        # with `gh attestation verify <file> --repo SingLinkLabs/singlink-vpn-app`.
        # Pull requests from forks get no id-token, so only pushes attest.
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: singlink-vpn-app/build/app/outputs/flutter-apk/*.apk

  macos:
    name: macos
    permissions:
      contents: read
      id-token: write      # build provenance attestation
      attestations: write  # build provenance attestation
    runs-on: macos-26  # pinned image; change deliberately
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: singlink-vpn-app
      - name: Read approved protocol revision
        id: protocol-pin
        # Fails the step (bash -e) if the pin record and go.mod disagree.
        run: |
          rev="$(python3 singlink-vpn-app/scripts/protocol_provenance.py pin)"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ steps.protocol-pin.outputs.revision }}
          repository: SingLinkLabs/singlink-protocol
          path: singlink-protocol
          token: ${{ github.token }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: singlink-vpn-app/core/go.mod
          cache-dependency-path: singlink-vpn-app/core/go.sum
      - name: Build libsinglink.dylib
        run: make -C singlink-vpn-app/core macos
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: flutter build macos
        working-directory: singlink-vpn-app
        env:
          # scripts/bundle_core_macos.sh copies this dylib into the .app.
          SINGLINK_CORE_LIB: ${{ github.workspace }}/singlink-vpn-app/core/build/macos/libsinglink.dylib
        run: |
          flutter pub get --enforce-lockfile
          flutter build macos --release
      - name: Hardened runtime and distribution gate
        working-directory: singlink-vpn-app
        # The release build must carry the hardened runtime. CI signs ad hoc
        # only, so the Developer ID + notarization gate must refuse it: the
        # artifact below is named UNSIGNED and is never a release.
        run: |
          app=build/macos/Build/Products/Release/SingLinkVPN.app
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee codesign.txt
          grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]*\(.*runtime.*\)' codesign.txt
          if python3 scripts/verify_macos_distribution.py "$app"; then
            echo "the distribution gate accepted an ad-hoc CI build"; exit 1
          fi
      - name: Zip
        working-directory: singlink-vpn-app/build/macos/Build/Products/Release
        run: ditto -c -k --keepParent SingLinkVPN.app "$GITHUB_WORKSPACE/SingLinkVPN-macos-UNSIGNED-adhoc-ci.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Ad-hoc signed, not Developer ID signed or notarized: not a release.
          name: SingLinkVPN-macos-UNSIGNED-adhoc-ci
          path: SingLinkVPN-macos-UNSIGNED-adhoc-ci.zip
          if-no-files-found: error
      - name: Attest build provenance
        # Signed SLSA provenance (Sigstore) for the uploaded artifact; verify
        # with `gh attestation verify <file> --repo SingLinkLabs/singlink-vpn-app`.
        # Pull requests from forks get no id-token, so only pushes attest.
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: SingLinkVPN-macos-UNSIGNED-adhoc-ci.zip

  ios:
    name: ios (no codesign)
    permissions:
      contents: read
    runs-on: macos-26  # pinned image; change deliberately
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: singlink-vpn-app
      - name: Read approved protocol revision
        id: protocol-pin
        # Fails the step (bash -e) if the pin record and go.mod disagree.
        run: |
          rev="$(python3 singlink-vpn-app/scripts/protocol_provenance.py pin)"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ steps.protocol-pin.outputs.revision }}
          repository: SingLinkLabs/singlink-protocol
          path: singlink-protocol
          token: ${{ github.token }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: singlink-vpn-app/core/go.mod
          cache-dependency-path: singlink-vpn-app/core/go.sum
      - name: Build Singlink.xcframework
        run: make -C singlink-vpn-app/core ios
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: flutter build ios
        working-directory: singlink-vpn-app
        run: |
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-codesign
      - name: iOS RunnerTests on a fresh Simulator
        working-directory: singlink-vpn-app
        # A new, throwaway Simulator: the tests generate their own synthetic
        # values and never read an existing profile or Keychain item.
        run: |
          flutter build ios --config-only --debug --simulator
          # Newest available iOS runtime and an iPhone type that it supports.
          read -r runtime devtype < <(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rs = [r for r in json.load(sys.stdin)["runtimes"]
                if r["isAvailable"] and r["platform"] == "iOS"
                and any(d["name"].startswith("iPhone") for d in r.get("supportedDeviceTypes", []))]
          r = rs[-1]
          d = [d for d in r["supportedDeviceTypes"] if d["name"].startswith("iPhone")][-1]
          print(r["identifier"], d["identifier"])')
          echo "runtime $runtime, device type $devtype"
          udid="$(xcrun simctl create ci-runnertests "$devtype" "$runtime")"
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "id=$udid" -derivedDataPath build/xcode-test -only-testing:RunnerTests
          xcrun simctl delete "$udid"
